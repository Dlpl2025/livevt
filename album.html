<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo & Video Gallery</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --accent: #3b82f6;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.5rem;
      background: var(--card-bg);
      border-bottom: 1px solid #272a34;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .btn-back {
      background: #2a2e39;
      color: var(--text);
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: none;
    }

    .btn-back:hover {
      background: #373b49;
    }

    main {
      padding: 1.25rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .album-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #272a34;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .album-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .album-cover {
      height: 170px;
      background-size: cover;
      background-position: center;
      background-color: #272a34;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .album-info {
      padding: 1rem;
    }

    .album-info h3 {
      font-size: 1.05rem;
      margin-bottom: 0.25rem;
      text-transform: capitalize;
    }

    .album-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .photo-grid-wrapper {
      display: none;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
    }

    .photo-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 8px;
      background-color: #1f232b;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
    }

    .photo-item:hover img {
      transform: scale(1.05);
    }

    .play-badge {
      position: absolute;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      pointer-events: none;
      border: 2px solid rgba(255, 255, 255, 0.85);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .photo-item:hover .play-badge,
    .album-card:hover .play-badge {
      transform: scale(1.1);
      background: var(--accent);
      border-color: #fff;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      user-select: none;
    }

    .lightbox-media-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }

    .lightbox-content {
      max-width: 96vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 6px;
    }

    /* Native HTML5 Video Element (Clean Android Video Experience) */
    .native-video-player {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      outline: none;
    }

    .native-video-player.fill-mode {
      object-fit: cover;
    }

    .lightbox-video-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      background: #000;
    }

    .lightbox-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 100000;
    }

    .lightbox-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }

    /* Top Overlay Action Buttons */
    .top-controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.6rem;
      z-index: 100002;
    }

    .lightbox-action-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 1rem;
      padding: 0.5rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .lightbox-close {
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      padding: 0;
    }

    .lightbox-close:hover {
      background: rgba(239, 68, 68, 0.85);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 1.2rem;
      color: #fff;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.65);
      padding: 0.3rem 0.75rem;
      border-radius: 12px;
      z-index: 100000;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="view-title">Photo Albums</h1>
    <button class="btn-back" id="btn-back" onclick="showAlbums()">← Back to Albums</button>
  </header>

  <main>
    <!-- Albums View -->
    <div class="album-grid" id="album-container"></div>

    <!-- Photo/Video Grid View -->
    <div class="photo-grid-wrapper" id="photo-container">
      <div class="photo-grid" id="photo-grid"></div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <div class="top-controls">
      <!-- Full Zoom / Fit Toggle Button for Video -->
      <button class="lightbox-action-btn" id="btn-aspect" onclick="toggleAspectFit()" style="display: none;">↔ Fit / Fill</button>
      <button class="lightbox-action-btn lightbox-close" onclick="closeLightbox()" title="Close (Esc)">×</button>
    </div>

    <button class="lightbox-btn lightbox-prev" id="btn-prev" onclick="prevPhoto()">❮</button>
    
    <div class="lightbox-media-container" id="media-container">
      <!-- Image Display -->
      <img src="" alt="Full view" class="lightbox-content" id="lightbox-img" style="display: none;">
      
      <!-- Clean HTML5 Video Player (First Priority - No Google Drive UI) -->
      <video id="native-video" class="native-video-player" controls playsinline webkit-playsinline autoplay style="display: none;"></video>
      
      <!-- Fallback Drive Iframe (Only if direct stream is unavailable) -->
      <iframe src="" class="lightbox-video-frame" id="lightbox-video" allow="autoplay; fullscreen" allowfullscreen style="display: none;"></iframe>
    </div>

    <button class="lightbox-btn lightbox-next" id="btn-next" onclick="nextPhoto()">❯</button>
    <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
  </div>

    let currentAlbum = null;
    let activePhotoIndex = 0;
    let isFillMode = false;

    function renderAlbums() {
      const container = document.getElementById('album-container');
      container.innerHTML = '';

      albums.forEach(album => {
        const isVideoAlbum = album.type === 'video' || album.id === 'video';
        let coverHtml = '';

        if (isVideoAlbum) {
          coverHtml = `
            <div class="album-cover" style="background: linear-gradient(135deg, #1e293b, #0f172a);">
              <div class="play-badge">▶</div>
            </div>`;
        } else {
          const coverUrl = album.photos.length > 0 ? getDriveDirectUrl(album.photos[0].id) : '';
          coverHtml = `<div class="album-cover" style="background-image: url('${coverUrl}')"></div>`;
        }

        const card = document.createElement('div');
        card.className = 'album-card';
        card.onclick = () => openAlbum(album);
        card.innerHTML = `
          ${coverHtml}
          <div class="album-info">
            <h3>${album.title}</h3>
            <p>${album.photos.length} ${isVideoAlbum ? 'Videos' : 'Photos'}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openAlbum(album) {
      currentAlbum = album;
      document.getElementById('album-container').style.display = 'none';
      document.getElementById('photo-container').style.display = 'block';
      document.getElementById('btn-back').style.display = 'block';
      document.getElementById('view-title').innerText = album.title;

      const grid = document.getElementById('photo-grid');
      grid.innerHTML = '';

      const isVideo = album.type === 'video' || album.id === 'video';

      album.photos.forEach((photo, index) => {
        const item = document.createElement('div');
        item.className = 'photo-item';
        item.onclick = () => openLightbox(index);

        if (isVideo) {
          item.innerHTML = `
            <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background: linear-gradient(135deg, #1e293b, #0f172a);">
              <div class="play-badge">▶</div>
            </div>
          `;
        } else {
          item.innerHTML = `<img src="${getDriveDirectUrl(photo.id)}" loading="lazy" alt="Photo ${index + 1}">`;
        }
        grid.appendChild(item);
      });
    }

    function showAlbums() {
      closeLightbox();
      document.getElementById('album-container').style.display = 'grid';
      document.getElementById('photo-container').style.display = 'none';
      document.getElementById('btn-back').style.display = 'none';
      document.getElementById('view-title').innerText = 'Photo Albums';
      currentAlbum = null;
    }

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const nativeVideo = document.getElementById('native-video');
    const iframeVideo = document.getElementById('lightbox-video');
    const btnAspect = document.getElementById('btn-aspect');
    const lightboxCounter = document.getElementById('lightbox-counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Fallback if native direct stream fails
    nativeVideo.onerror = function() {
      if (currentAlbum && (currentAlbum.type === 'video' || currentAlbum.id === 'video')) {
        const item = currentAlbum.photos[activePhotoIndex];
        nativeVideo.style.display = 'none';
        iframeVideo.style.display = 'block';
        iframeVideo.src = getDriveVideoEmbedUrl(item.id);
      }
    };

    function toggleAspectFit() {
      isFillMode = !isFillMode;
      if (isFillMode) {
        nativeVideo.classList.add('fill-mode');
        btnAspect.innerText = '⤢ Fill (Active)';
      } else {
        nativeVideo.classList.remove('fill-mode');
        btnAspect.innerText = '↔ Fit (Active)';
      }
    }

    function openLightbox(index) {
      activePhotoIndex = index;
      lightbox.style.display = 'flex';
      updateLightbox();
    }

    function closeLightbox() {
      lightbox.style.display = 'none';
      
      // Stop native video playback
      nativeVideo.pause();
      nativeVideo.src = '';
      nativeVideo.style.display = 'none';

      // Stop iframe playback
      iframeVideo.src = '';
      iframeVideo.style.display = 'none';

      lightboxImg.style.display = 'none';
      btnAspect.style.display = 'none';
    }

    function updateLightbox() {
      if (!currentAlbum || currentAlbum.photos.length === 0) return;

      const item = currentAlbum.photos[activePhotoIndex];
      const isVideo = currentAlbum.type === 'video' || currentAlbum.id === 'video';

      if (currentAlbum.photos.length <= 1) {
        btnPrev.style.display = 'none';
        btnNext.style.display = 'none';
      } else {
        btnPrev.style.display = 'flex';
        btnNext.style.display = 'flex';
      }

      if (isVideo) {
        lightboxImg.style.display = 'none';
        btnAspect.style.display = 'block';

        // Try clean Native HTML5 player first
        iframeVideo.style.display = 'none';
        iframeVideo.src = '';
        nativeVideo.style.display = 'block';
        nativeVideo.src = getDriveStreamUrl(item.id);
        nativeVideo.play().catch(() => {});
      } else {
        btnAspect.style.display = 'none';
        nativeVideo.pause();
        nativeVideo.src = '';
        nativeVideo.style.display = 'none';
        iframeVideo.src = '';
        iframeVideo.style.display = 'none';

        lightboxImg.style.display = 'block';
        lightboxImg.src = getDriveDirectUrl(item.id);
      }

      lightboxCounter.innerText = `${activePhotoIndex + 1} / ${currentAlbum.photos.length}`;
    }

    function nextPhoto() {
      if (!currentAlbum || currentAlbum.photos.length <= 1) return;
      activePhotoIndex = (activePhotoIndex + 1) % currentAlbum.photos.length;
      updateLightbox();
    }

    function prevPhoto() {
      if (!currentAlbum || currentAlbum.photos.length <= 1) return;
      activePhotoIndex = (activePhotoIndex - 1 + currentAlbum.photos.length) % currentAlbum.photos.length;
      updateLightbox();
    }

    window.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') nextPhoto();
        if (e.key === 'ArrowLeft') prevPhoto();
        if (e.key === 'Escape') closeLightbox();
      }
    });

    renderAlbums();
  </script>
</body>
</html>
